on:
  workflow_dispatch:
  push:
    branches:
      - feature/ambientes-hml-prod
    paths:
      - ".github/workflows/secrets-prod.yaml"

jobs:
  secrets:
    name: Provisionar Secrets PROD
    runs-on: self-hosted

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Provisionar Secret PostgreSQL PROD
        env:
          DB_PASSWORD: ${{ secrets.POSTGRES_PASSWORD_PROD }}
        run: |
          set -euo pipefail

          if [ -z "$DB_PASSWORD" ]; then
            echo "ERRO: POSTGRES_PASSWORD_PROD não configurado."
            exit 1
          fi

          kubectl create secret generic postgres-credentials \
            --namespace=prod \
            --from-literal=password="$DB_PASSWORD" \
            --from-literal=connection-string="Host=postgre;Database=reviewfilmes;Username=reviewfilmes;Password=$DB_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -  