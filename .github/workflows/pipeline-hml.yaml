
name: Pipeline CI/CD HML

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/ambientes-hml-prod

concurrency:
  group: deploy-hml
  cancel-in-progress: false

jobs:
  build:
    name: Build HML
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.300"

      - name: Build da aplicação
        working-directory: ./src
        run: dotnet build Review-Filmes.sln

  testes:
    needs: [build]
    uses: ./.github/workflows/testes.yaml
    secrets: inherit

  release:
    name: Publicar imagem HML
    needs: [testes]
    runs-on: ubuntu-latest
    steps:
      - name: Obtendo o código do projeto
        uses: actions/checkout@v4

      - name: Analise do Dockerfile
        uses: hadolint/hadolint-action@v3.4.0
        with:
          dockerfile: ./src/Review-Filmes.Web/Dockerfile

      - name: Efetuando o Login no Docker Hub
        uses: docker/login-action@v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PWD }}

      - name: Build e Push da imagem HML
        uses: docker/build-push-action@v7.4.0
        with:
          push: true
          context: ./src
          file: ./src/Review-Filmes.Web/Dockerfile
          tags: |
            networkshtech/desafio-cicd:hml-${{ github.sha }}

  deploy:
    name: Deploy HML
    needs: [release]
    uses: ./.github/workflows/deploy-hml.yaml
    with:
      image_tag: hml-${{ github.sha }}

  deploy-prod:
    name: Promover HML para PROD
    needs: [deploy]
    uses: ./.github/workflows/deploy-prod.yaml
    with:
      image_tag: hml-${{ github.sha }}
